[project]
name = "booking"
version = "0.1.0"
description = "Classroom booking system MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "hypothesis>=6.120",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-playwright>=0.6",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booking"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: domain and services with in-memory fakes, no Docker",
    "contract: the same repository suite against every adapter",
    "integration: Postgres adapter and API against a real database",
    "concurrency: parallel requests on the same slot or user",
    "property: Hypothesis stateful tests",
    "e2e: Playwright, main user flows only",
]

[tool.coverage.run]
source = ["booking"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.importlinter]
root_package = "booking"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain depends on the standard library only"
type = "forbidden"
source_modules = ["booking.domain"]
forbidden_modules = [
    "booking.ports",
    "booking.services",
    "booking.adapters",
    "booking.jobs",
    "booking.main",
    "alembic",
    "fastapi",
    "psycopg",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Services depend only on domain and ports"
type = "forbidden"
source_modules = ["booking.services"]
forbidden_modules = [
    "booking.adapters",
    "booking.jobs",
    "booking.main",
    "alembic",
    "fastapi",
    "psycopg",
    "uvicorn",
]
